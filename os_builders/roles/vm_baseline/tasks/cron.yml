- name: Install cron on Ubuntu
  ansible.builtin.apt:
    name: "cron"
    state: present
    update_cache: true
  when: ansible_distribution == "Ubuntu"
  become: true

- name: Install cron on RL
  ansible.builtin.dnf:
    name: "cronie"
    state: present
  when: ansible_distribution == "Rocky"
  become: true
