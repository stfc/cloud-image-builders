- name: Ensure Python is installed so future Ansible modules can run
  become: true
  ansible.builtin.raw: |
    set -euo pipefail
    if command -v dnf &> /dev/null; then
      dnf install -y epel-release python3.12 python3.12-pip
    elif command -v apt &> /dev/null; then
      apt update
      apt install -y python3 python3-pip
    else
      echo "[ERROR] No supported package manager found (dnf or apt)."
      exit 1
    fi
  args:
    executable: /bin/bash
